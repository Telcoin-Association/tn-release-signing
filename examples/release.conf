# shellcheck shell=bash disable=SC2034 # release.sh reads these values after sourcing the file
# release.conf for telcoin-network: the values release.sh had built in when it was imported,
# and the node's own release steps as commented hooks.
#
# A project copies this file to release.conf in its repository root, the parent of the
# directory that holds release.sh (etc/ in telcoin-network, the submodule directory in a
# project that carries tn-release-signing as a submodule). release.sh therefore sits one
# directory below the root, and it refuses a SELF_REPO_PATH that names anything but itself
# (etc/release.sh) or, in the submodule layout, that directory (release). It sources this
# file first, so the file is bash 3.2: no associative arrays, mapfile, ${x,,}, sed -i or GNU
# date. build and publish refuse a release.conf that differs from the copy on MAIN_REF, since
# it sets the signature threshold and its hooks run in every step.
#
# With the hooks below left commented out, release.sh runs the generic pipeline on these
# values: the tarball and SHA256SUMS, no image and no chain-config files; prep needs a
# hook_changelog.

# ---------------------------------------------------------------------------------------------
# Required

# Project name: the tarball is PROJECT-TAG-TRIPLE.tar.gz with the directory
# PROJECT-TAG-TRIPLE/ inside, and DEFAULT_REPO is used when RELEASE_REPO is unset outside CI.
PROJECT=telcoin-network
DEFAULT_REPO=Telcoin-Association/telcoin-network

# Release tags. Groups 1-3 must capture X, Y and Z; a trailing -rcN marks a release candidate;
# whatever TAG_RE allows between vX.Y.Z and -rcN names a channel (here -adiri), and the
# version rules and GitHub's latest release apply per channel.
TAG_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-adiri)?(-rc[1-9][0-9]*)?$'

# Target triple in the tarball name, and the files the tarball holds, separated by spaces:
# the first is the program (built by hook_build, executable), the others come from the root
# of the tag's tree.
TRIPLE=x86_64-unknown-linux-gnu
TARBALL_FILES='telcoin-network LICENSE-APACHE LICENSE-MIT NOTICE'

# The Cargo.toml whose version prep sets and check-tag compares with the tag: its
# [workspace.package] version when it has one, else its [package] version. CHANGELOG_FILE
# carries one "## [vX.Y.Z] - YYYY-MM-DD" section per release, which prep writes right after
# the ANCHOR line.
VERSION_FILE=Cargo.toml
CHANGELOG_FILE=CHANGELOG.md
ANCHOR='<!-- ANCHOR: releases -->'

# The ref a release must be on, where the maintainer keys and the scripts are read from.
MAIN_REF=refs/remotes/origin/main
# Local directory for the release files build and sign write, one subdirectory per tag.
ARTIFACT_ROOT=target/release-artifacts
# Maintainer signatures over SHA256SUMS that publish requires; RELEASE_SIG_THRESHOLD may
# raise it, never lower it. At least 1.
MIN_SIGNATURES=1
# Directory on MAIN_REF holding one <GitHub login>.asc per maintainer.
KEYS_PATH=.github/maintainer-gpg-keys
# Repository path of release.sh on MAIN_REF; build and publish compare the running script
# with it. It is one directory deep, as release.sh requires: the script here, or the
# submodule directory (such as release) in the submodule layout.
SELF_REPO_PATH=etc/release.sh

# ---------------------------------------------------------------------------------------------
# Optional (empty unless set)

# EXTRA_ASSETS     release assets the build writes beside the tarball; SHA256SUMS lists them
#                  and every step uploads, downloads and checks them (the node sets
#                  IMAGE_DIGEST in hook_parse_extras below)
# EXTRA_SCRIPTS    more repository paths that build and publish require to equal MAIN_REF's
# BUILD_IMAGE      the image, pinned by digest, the default hook_build runs
#                  `cargo build --locked --release --target TRIPLE --bin <program>` in; the node
#                  replaces hook_build and needs none

