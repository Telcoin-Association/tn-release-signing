# shellcheck shell=bash disable=SC2034 # release.sh reads these values after sourcing the file
# release.conf for a plain cargo package that carries tn-release-signing as a submodule at
# release/, with the values of tn-p2p-allow-sync, its first consumer. tests/dry_run_test.sh
# runs every step on these values, with a stand-in hook_build.
#
# Copy it to release.conf in the project's repository root, the parent of release/, and run
# the steps as ./release/release.sh <step> <TAG>. The submodule sits one directory below the
# root: release.sh reads release.conf from the parent of its own directory and refuses a
# SELF_REPO_PATH that does not name that directory. It is bash 3.2, as release.sh sources it
# first: no associative arrays, mapfile, ${x,,}, sed -i or GNU date. build and publish refuse
# a release.conf that differs from the copy on MAIN_REF. examples/release.conf describes
# every key at more length.

# ---------------------------------------------------------------------------------------------
# Required

# The tarball is PROJECT-TAG-TRIPLE.tar.gz with the directory PROJECT-TAG-TRIPLE/ inside;
# DEFAULT_REPO is used when RELEASE_REPO is unset outside CI.
PROJECT=tn-p2p-allow-sync
DEFAULT_REPO=Telcoin-Association/tn-p2p-allow-sync

# vX.Y.Z finals and vX.Y.Z-rcN release candidates, one channel.
TAG_RE='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc[1-9][0-9]*)?$'

# A static musl program, then the files the tarball takes from the root of the tag's tree.
TRIPLE=x86_64-unknown-linux-musl
TARBALL_FILES='tn-p2p-allow-sync LICENSE-APACHE LICENSE-MIT NOTICE'

# The package's Cargo.toml: prep sets its [package] version, and check-tag compares it with
# the tag. prep writes each release's "## [vX.Y.Z] - YYYY-MM-DD" section after the ANCHOR line.
VERSION_FILE=Cargo.toml
CHANGELOG_FILE=CHANGELOG.md
ANCHOR='<!-- ANCHOR: releases -->'

# The branch a release must be on, as the ref a fetch of origin writes; release.sh refuses any
# other form than refs/remotes/origin/<branch>.
MAIN_REF=refs/remotes/origin/main
ARTIFACT_ROOT=target/release-artifacts
# At least the "Signatures required" line of KEYS.md at the submodule commit MAIN_REF records,
# which release.sh checks; more is allowed.
MIN_SIGNATURES=1
# The submodule layout: the maintainer keys and release.sh are read from the submodule commit
# that MAIN_REF records for release/, never from the checkout, and KEYS_PATH must lie inside
# release/.
KEYS_PATH=release/keys
SELF_REPO_PATH=release

# ---------------------------------------------------------------------------------------------
# Optional

# The image the default hook_build runs `cargo build --locked --release --target TRIPLE` in,
# pinned by digest; the hook_build sketch below passes it to its Dockerfile instead. Check
# when pinning that it ships gcc and musl-dev.
# BUILD_IMAGE='rust:1.94-alpine@sha256:<digest>'

# prep needs a hook_changelog that writes the new CHANGELOG section; with git-cliff and a
# cliff.toml in the repository root:
# hook_changelog() { cliff_section "$1"; }

